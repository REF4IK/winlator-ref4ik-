layout.buildDirectory.set(file("$projectDir/build-win"))

android {
    namespace 'com.winlator.cmod'
    // Keep compileSdk from your current config. If you want to match Termux-X11, you could set to 34.
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.winlator.cmod"
        minSdkVersion 26
        // We’re preserving Winlator’s request to keep targetSdkVersion at 28
        targetSdkVersion 28

        versionCode 20
        versionName "7.1.4x-cmod"

        // External native build from Winlator
        externalNativeBuild {
            cmake {
                cppFlags ''
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        // You originally only did arm64-v8a. If you want multi-ABI splits, see below.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }


    // Java versions: Winlator uses Java 17, Termux-X11 used 1.9
    // Using 17 is typically fine (covers 1.9 features).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Keep Winlator’s buildTypes
    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        // If you have a release build type, add it here
    }

    signingConfigs {
        debug {
            storeFile file('debug-modern.jks')
            keyAlias 'androiddebugkey'
            storePassword 'android'
            keyPassword 'android'
            enableV1Signing true
            enableV2Signing true
        }
    }

    ndkVersion '27.0.12077973'  // use installed NDK with valid source.properties

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // If you want to be sure modern JNI packaging is used:
    packaging {
        resources {
            excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    // Отключаем fatal lint errors для release сборки
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Task для перемещения ВСЕХ поврежденных ab_* анимаций и связанных XML
tasks.register('moveCorruptedPngs') {
    doLast {
        def drawableDir = new File(project.projectDir, 'src/main/res/drawable')
        def backupDir = new File(project.buildDir, 'corrupted-pngs-backup')
        backupDir.mkdirs()
        
        // Перемещаем ВСЕ файлы начинающиеся с ab_ (все анимационные спрайты повреждены)
        drawableDir.listFiles().each { file ->
            if (file.name.startsWith('ab_') && (file.name.endsWith('.png') || file.name.endsWith('.corrupted'))) {
                def targetFile = new File(backupDir, file.name.replace('.corrupted', ''))
                if (file.renameTo(targetFile)) {
                    println "Moved: ${file.name} -> build/corrupted-pngs-backup/"
                }
            }
        }
        
        // Также перемещаем XML файлы анимаций, которые ссылаются на ab_* PNG
        def animationXmls = ['animated_background.xml', 'animated_gear.xml', 'animated_quilt.xml']
        animationXmls.each { xmlName ->
            def xmlFile = new File(drawableDir, xmlName)
            if (xmlFile.exists()) {
                def targetFile = new File(backupDir, xmlName)
                if (xmlFile.renameTo(targetFile)) {
                    println "Moved: ${xmlName} -> build/corrupted-pngs-backup/"
                }
            }
        }
    }
}

// Автоматически перемещаем файлы перед сборкой ресурсов
afterEvaluate {
    tasks.named('mergeReleaseResources').configure {
        dependsOn 'moveCorruptedPngs'
    }
    tasks.named('mergeDebugResources').configure {
        dependsOn 'moveCorruptedPngs'
    }
}

